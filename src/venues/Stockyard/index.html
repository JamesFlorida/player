<!DOCTYPE html>
<!-- Test Stockyard Version  -->
<html lang="en">
<head>
<!--added comment below
============================================
VENUE ASSETS: TOUCH ICON (HOME SCREEN ICON)
- PNG only
- Recommended size: 180x180 pixels
- This is what shows when user "Add to Home Screen"
- Will be set dynamically from venueConfig.assets.touchIconUrl
============================================
-->
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stockyard Line Dance App</title>

    <!-- Venue Touch Icon (set dynamically from venueConfig) -->
    <link id="venueTouchIcon" rel="apple-touch-icon" href="">
    
    <!-- Shared Styles -->
    <link rel="stylesheet" href="/player/src/styles.css">
    <link rel="stylesheet" href="/player/src/venues/Stockyard/stockyard.css?v=6">



    <!-- Shared App Logic -->
    <script src="/player/src/app.js" defer></script>

    <!-- Stockyard Venue Config -->
    <script src="/player/src/venues/Stockyard/venueConfig.js" defer></script>

    <!-- Stockyard Dance Data -->
    <script src="/player/src/venues/Stockyard/danceData-stockyard.js" defer></script>
    
    <!-- next line added to suppress favicon error --> 
    <link rel="icon" href="data:,"> 

</head>
<body>

    <!--
    ============================================
    OPTIONAL SPLASH SCREEN
    - Will be shown briefly if venueConfig.assets.splashImageUrl is set.
    - PNG or SVG, recommended width: 600–1200px.
    ============================================
    -->
    <div id="venueSplash" class="venue-splash-screen" style="display:none;">
        <img id="venueSplashImage" src="" alt="Venue Splash">
        <span id="venueSplashText">Loading LineDance Player...</span>
    </div>
    <header class="venue-header">
    <img src="images/Stockyard-header-Bull-Logo.png"
         alt="The Stockyard Logo"
         class="stockyard-logo">
   </header>

    <div class="header-bar">
        <button class="back-nav-btn"
                id="navbarReturnTrigger"
                onclick="navigateToPlaylistHubMenu()">⬅ Playlists</button>
        <span id="applicationHeaderTitle">The Stockyard Line Dance Player</span>
    </div>

    <!--
    ============================================
    VENUE BANNER (OPTIONAL)
    - PNG or SVG.
    - Recommended width: 600–1200px.
    - If no bannerUrl is provided, this will be hidden.
    ============================================
    -->
    <div class="app-container" style="padding-bottom: 0;">
        <img id="venueBanner" class="venue-banner" src="" alt="Venue Banner" style="display:none;">
    </div>

       <!--
    ============================================
    DANCE NIGHT FILTER BAR
    - Lets users filter by night taught.
    ============================================
    -->
    <div class="app-container" style="padding: 8px 16px 0 16px;">
        <button class="sync-btn" onclick="setDayFilter('ALL')">All</button>
        <button class="sync-btn" onclick="setDayFilter('Tuesday')">Tuesday</button>
        <button class="sync-btn" onclick="setDayFilter('Wednesday')">Wednesday</button>
        <button class="sync-btn" onclick="setDayFilter('Weekend')">Thu–Fri–Sat</button>
    </div>

    <!--
    ============================================
    SEARCH + SYNC BAR
    - Placeholder text will be set from venueConfig.searchPlaceholder.
    ============================================
    -->
  <div class="app-container search-bar-row">
    <input type="text"
           id="danceSearchInput"
           placeholder=""
           oninput="handleLiveSearchInput()">

    <button class="sync-btn" onclick="forceCacheBusterReload()">
        Sync Playlist
    </button>
</div>




    <!--
    ============================================
    INSTRUCTOR PHOTO (OPTIONAL)
    - JPG or PNG.
    - Recommended height: 400–800px.
    - If no instructorPhotoUrl is provided, this will be hidden.
    ============================================
    -->
    <div class="app-container instructor-photo-row">
    <img id="venueInstructorPhoto" class="venue-instructor-photo" src="" alt="Instructor">
    </div>


    <!--
    ============================================
    EMAIL / FEEDBACK BANNER
    - Text will be set from venueConfig.email and venueConfig.name.
    ============================================
    -->
    <div style="text-align: center; margin: 15px auto; padding: 0 20px; max-width: 650px; box-sizing: border-box;">
        <span id="venueEmailBanner"
              style="color: #b3b3b3; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 0.95rem; font-weight: bold; letter-spacing: 0.3px;">
        </span>
    </div>

    <!-- MAIN APP VIEWPORT -->
    <div class="app-container" id="masterApplicationViewport"></div>

    <!-- OVERLAY FOR STEPS / YOUTUBE -->
    <div id="playerOverlayFrame" class="inapp-overlay-window"></div>

    <!-- WATERMARK LOGO (OPTIONAL) -->
    <img id="venueWatermark" class="venue-watermark" src="" alt="Venue Watermark" style="display:none;">

    <!-- FOOTER BADGE (OPTIONAL) -->
    <div id="venueFooter" class="venue-footer"></div>
    <link rel="stylesheet" href="/player/src/styles.css">
   
</body>
</html>
