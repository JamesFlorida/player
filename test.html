<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LineDance Player - Stockyard Edition</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://github.io">
    <style>
        /* 🎨 STOCKYARD VENUE THEME VARIABLES */
        :root {
            --brand-green: #00e676;   /* Vivid Stockyard Neon Green */
            --dark-gray: #121212;     /* Deep Charcoal Slate Background */
            --card-bg: #1e1e1e;       /* Smooth Slate Gray Playlist Cards */
            --btn-blue: #2c3e50;      /* Dark Premium Accent Blue Buttons */
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--dark-gray);
            color: white;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .header-bar {
            background-color: var(--brand-green);
            padding: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.3rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            position: sticky;
            top: 0;
            z-index: 100;
            height: 60px;
            box-sizing: border-box;
            color: #121212;
        }
        .back-nav-btn {
            position: absolute;
            left: 15px;
            background: rgba(0,0,0,0.7);
            border: 1px solid #444;
            color: white;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }
        .app-container {
            padding: 20px;
            max-width: 650px;
            margin: 0 auto;
            box-sizing: border-box;
        }
        .playlist-selection-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding-top: 10px;
        }
        .playlist-hub-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
            border-bottom: 4px solid var(--brand-green);
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }
        .playlist-track-counter {
            font-size: 0.85rem;
            color: #aaa;
            margin-top: 8px;
            font-weight: normal;
        }
        .dance-entry-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            border-left: 5px solid var(--brand-green);
        }
        .title-line {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 6px;
            text-align: center;
        }
        .meta-line {
            font-size: 0.95rem;
            color: #b3b3b3;
            margin-bottom: 22px;
            text-align: center;
            line-height: 1.4;
        }
        .button-bar-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        .action-touch-btn {
            background-color: var(--btn-blue);
            color: white;
            border: none;
            padding: 14px 2px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
            transition: background 0.1s;
            text-decoration: none;
            display: block;
        }
        .action-touch-btn:active {
            background-color: var(--brand-green);
            color: #121212;
        }
        .action-touch-btn.disabled {
            background-color: #333;
            color: #666;
            cursor: not-allowed;
            box-shadow: none;
            pointer-events: none;
        }
        .inapp-overlay-window {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 99999;
        }
        .overlay-control-header {
            background: #111111;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            border-bottom: 1px solid #333;
        }
        .overlay-title {
            font-weight: bold;
            color: #fff;
            font-size: 1rem;
        }
        .done-close-btn {
            background: var(--brand-green);
            color: #121212;
            border: none;
            padding: 9px 20px;
            font-weight: bold;
            font-size: 0.95rem;
            border-radius: 6px;
            cursor: pointer;
        }
        .overlay-viewport-iframe, object {
            width: 100%;
            height: calc(100% - 55px);
            border: none;
            background: white;
        }
        @media (max-width: 380px) {
            .header-bar {
                height: 48px !important;
                padding: 10px !important;
                font-size: 1.1rem !important;
            }
        }
    </style>
</head>
<body>
    <div class="header-bar">
        <button class="back-nav-btn" id="navbarReturnTrigger" onclick="navigateToPlaylistHubMenu()">⬅ Playlists</button>
        <span id="applicationHeaderTitle">Stockyard Player</span>
    </div>
    <div class="app-container" style="padding-bottom: 0; display: flex; gap: 10px; align-items: center;">
        <input type="text" id="danceSearchInput" placeholder="🔍 Search Stockyard roster..." oninput="handleLiveSearchInput()" style="flex: 1; padding: 14px; border-radius: 8px; border: 1px solid #444; background: #1a1a1a; color: white; font-size: 1rem; box-sizing: border-box; height: 50px;">
        <button onclick="forceCacheBusterReload()" style="background: var(--brand-green); color: #121212; border: none; padding: 0 16px; border-radius: 8px; font-size: 0.95rem; font-weight: bold; cursor: pointer; height: 50px; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 6px rgba(0,0,0,0.2); white-space: nowrap;">Sync Playlist</button>
    </div>
    <div style="text-align: center; margin: 15px auto; padding: 0 20px; max-width: 650px; box-sizing: border-box;">
        <span style="color: #b3b3b3; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 0.95rem; font-weight: bold; letter-spacing: 0.3px;">
            ✉ Stockyard Feedback & Music Requests: tampadancing@gmail.com
        </span>
    </div>
    <div class="app-container" id="masterApplicationViewport"></div>
    <div id="playerOverlayFrame" class="inapp-overlay-window"></div>

  { id: "126", group: "Stock-013", name: "Choosin Texas", choreographer: "Nidhi Risi", song: "Choosin Texas", artist: "Ella Langley", steps: "https://copperknob.co.uk", teach: "https://youtube.com", demo: "https://youtube.com", music: "https://youtube.com" },

  { id: "130", group: "Stock-013", name: "After Party", choreographer: "Maurice Rowe", song: "After Party", artist: "Koffee Brown", steps: "https://copperknob.co.uk", teach: "https://youtube.com", demo: "https://youtube.com", music: "https://youtube.com" },
  { id: "131", group: "Stock-014", name: "Weren't for the Wind", choreographer: "Amy Christian", song: "Weren't for the Wind", artist: "Ella Langley", steps: "https://copperknob.co.uk", teach: "https://youtube.com", demo: "https://youtube.com", music: "https://youtube.com" },
  { id: "134", group: "Stock-014", name: "Single Again", choreographer: "Mel Llewelin", song: "Single Again", artist: "Josh Ross", steps: "https://copperknob.co.uk", teach: "https://youtube.com", demo: "https://youtube.com", music: "https://youtube.com" },
  { id: "139", group: "Stock-014", name: "Backup Plan", choreographer: "Melanie Mahoney", song: "Backup Plan", artist: "Zimmerman/Combs", steps: "https://copperknob.co.uk", teach: "https://youtube.com", demo: "https://youtube.com", music: "https://youtube.com" },
  { id: "140", group: "Stock-014", name: "Boots Off", choreographer: "Rachael McNaney", song: "Boots Off", artist: "Jon Pardi", steps: "https://copperknob.co.uk", teach: "https://youtube.com", demo: "https://youtube.com", music: "https://youtube.com" }
];
let selectedActivePlaylistGroup = null;
let activeSearchQueryString = "";

function navigateToPlaylistHubMenu() {
    selectedActivePlaylistGroup = null;
    activeSearchQueryString = "";
    document.getElementById('danceSearchInput').value = "";
    document.getElementById('navbarReturnTrigger').style.display = 'none';
    document.getElementById('applicationHeaderTitle').innerText = 'Stockyard Player';
    renderApplicationInterface();
}

function openSpecificPlaylistView(groupName) {
    selectedActivePlaylistGroup = groupName;
    activeSearchQueryString = "";
    document.getElementById('danceSearchInput').value = "";
    document.getElementById('navbarReturnTrigger').style.display = 'block';
    document.getElementById('applicationHeaderTitle').innerText = groupName;
    renderApplicationInterface();
}

function handleLiveSearchInput() {
    const searchBox = document.getElementById('danceSearchInput');
    activeSearchQueryString = searchBox.value.toLowerCase().trim();
    if (activeSearchQueryString !== "") {
        selectedActivePlaylistGroup = null;
        document.getElementById('navbarReturnTrigger').style.display = 'block';
        document.getElementById('applicationHeaderTitle').innerText = 'Search Results';
    } else if (activeSearchQueryString === "" && selectedActivePlaylistGroup === null) {
        document.getElementById('navbarReturnTrigger').style.display = 'none';
        document.getElementById('applicationHeaderTitle').innerText = 'Stockyard Player';
    }
    renderApplicationInterface();
}

function renderApplicationInterface() {
    const viewport = document.getElementById('masterApplicationViewport');
    if(!viewport) return;
    viewport.innerHTML = '';
    
    if (activeSearchQueryString !== "") {
        const matchedTracks = localDanceDatabase.filter(track => {
            const danceName = (track.name || "").toLowerCase();
            const choreographer = (track.choreographer || "").toLowerCase();
            return danceName.includes(activeSearchQueryString) || choreographer.includes(activeSearchQueryString);
        });
        if(matchedTracks.length === 0) {
            viewport.innerHTML = '<p style="text-align:center;color:#aaa;margin-top:20px;">No matching dances found on the roster.</p>';
            return;
        }
        renderDanceCardsList(matchedTracks, viewport);
    } else if (selectedActivePlaylistGroup === null) {
        const groupNames = [...new Set(localDanceDatabase.map(track => track.group || "General"))].sort();
        const grid = document.createElement('div');
        grid.className = 'playlist-selection-grid';
        groupNames.forEach(name => {
            const count = localDanceDatabase.filter(t => t.group === name).length;
            const card = document.createElement('div');
            card.className = 'playlist-hub-card';
            card.innerHTML = `<div>${name}</div><div class="playlist-track-counter">${count} Dances</div>`;
            card.onclick = () => openSpecificPlaylistView(name);
            grid.appendChild(card);
        });
        viewport.appendChild(grid);
    } else {
        const filteredTracks = localDanceDatabase.filter(track => track.group === selectedActivePlaylistGroup);
        renderDanceCardsList(filteredTracks, viewport);
    }
}

function renderDanceCardsList(tracksList, containerElement) {
    tracksList.forEach(track => {
        const card = document.createElement('div');
        card.className = 'dance-entry-card';
        
        const btnSteps = track.steps ? `<button class="action-touch-btn" onclick="launchMediaOverlay('${track.steps}', '${track.name} - Steps')">Steps</button>` : `<button class="action-touch-btn disabled">None</button>`;
        const btnTeach = track.teach ? `<button class="action-touch-btn" onclick="launchMediaOverlay('${track.teach}', '${track.name} - Teach')">Teach</button>` : `<button class="action-touch-btn disabled">None</button>`;
        const btnDemo = track.demo ? `<button class="action-touch-btn" onclick="launchMediaOverlay('${track.demo}', '${track.name} - Demo')">Demo</button>` : `<button class="action-touch-btn disabled">None</button>`;
        const btnMusic = track.music ? `<button class="action-touch-btn" onclick="launchMediaOverlay('${track.music}', '${track.name} - Play')">Music</button>` : `<button class="action-touch-btn disabled">None</button>`;
        
        card.innerHTML = `
            <div class="title-line">${track.name} • By: ${track.choreographer}</div>
            <div class="meta-line">Song: ${track.song} - ${track.artist} (${track.group})</div>
            <div class="button-bar-grid">
                ${btnSteps}
                ${btnTeach}
                ${btnDemo}
                ${btnMusic}
            </div>
        `;
        containerElement.appendChild(card);
    });
}

function launchMediaOverlay(targetUrl, displayTitle) {
    if (!targetUrl) return;
    const container = document.getElementById('playerOverlayFrame');
    if (!container) return;
    
    // Safety Clean: Wipes out the background slate to guarantee a fresh rendering engine loop on every single tap
    container.style.display = 'none';
    container.innerHTML = '';
    
    if (displayTitle.includes("Steps")) {
        container.innerHTML = `
            <div class="overlay-control-header">
                <span class="overlay-title" id="overlayPanelTitle">${displayTitle}</span>
                <button class="done-close-btn" onclick="shutOverlayViewer()">Done</button>
            </div>
            <object data="${targetUrl}" style="width: 100%; height: calc(100% - 55px); border: none; background: white;" type="text/html"></object>
        `;
    } else {
        // PERMANENT VIDEO FIX: Injects explicit, bulletproof inline size tracking rules so your YouTube frames never collapse to 0 pixels
        container.innerHTML = `
            <div class="overlay-control-header">
                <span class="overlay-title" id="overlayPanelTitle">${displayTitle}</span>
                <button class="done-close-btn" onclick="shutOverlayViewer()">Done</button>
            </div>
        
            <iframe src="${targetUrl}" style="width: 100%; height: calc(100% - 55px); border: none; background: white;" allow="autoplay; encrypted-media; fullscreen"></iframe>
        `;
    }
    container.style.display = 'block';
}


function shutOverlayViewer() {
    const container = document.getElementById('playerOverlayFrame');
    if (container) {
        container.style.display = 'none';
        container.innerHTML = '';
    }
}

function forceCacheBusterReload() {
    const uniqueTimestamp = new Date().getTime();
    window.location.href = window.location.origin + window.location.pathname + '?v=' + uniqueTimestamp;
}

window.onload = renderApplicationInterface;
</script>
</body>
</html>
