<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LineDance Player - Venue Template</title>

    <!--
    ============================================
    VENUE ASSETS: TOUCH ICON (HOME SCREEN ICON)
    - PNG only
    - Recommended size: 180x180 pixels
    - This is what shows when user "Add to Home Screen"
    - Will be set dynamically from venueConfig.assets.touchIconUrl
    ============================================
    -->
    <link id="venueTouchIcon" rel="apple-touch-icon" href="">

    <style>
        /* ============================================
           VENUE THEME VARIABLES (BASE)
           - These are "internal" CSS variables.
           - JS will set them from venueConfig.theme.
           ============================================ */
        :root {
            --brand-green: #2ecc71;   /* Default generic green */
            --dark-gray: #1e1e1e;    /* Default dark background */
            --card-bg: #2b2b2b;      /* Default card background */
            --btn-blue: #34495e;     /* Default button color */

            /* Background image (optional)
               JS will set this to url(...) if provided. */
            --venue-bg-image: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--dark-gray);
            background-image: var(--venue-bg-image); /* Optional venue background */
            background-size: cover;
            background-repeat: no-repeat;
            color: white;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .header-bar {
            background-color: var(--brand-green);
            padding: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.3rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            position: sticky;
            top: 0;
            z-index: 100;
            height: 60px;
            box-sizing: border-box;
            color: #121212;
        }

        .back-nav-btn {
            position: absolute;
            left: 15px;
            background: rgba(0,0,0,0.7);
            border: 1px solid #444;
            color: white;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }

        .app-container {
            padding: 20px;
            max-width: 650px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .playlist-selection-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding-top: 10px;
        }

        .playlist-hub-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
            border-bottom: 4px solid var(--brand-green);
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .playlist-track-counter {
            font-size: 0.85rem;
            color: #aaa;
            margin-top: 8px;
            font-weight: normal;
        }

        .dance-entry-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            border-left: 5px solid var(--brand-green);
        }

        .title-line {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 6px;
            text-align: center;
        }

        .meta-line {
            font-size: 0.95rem;
            color: #b3b3b3;
            margin-bottom: 22px;
            text-align: center;
            line-height: 1.4;
        }

        .button-bar-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .action-touch-btn {
            background-color: var(--btn-blue);
            color: white;
            border: none;
            padding: 14px 2px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
            transition: background 0.1s;
            text-decoration: none;
            display: block;
        }

        .action-touch-btn:active {
            background-color: var(--brand-green);
            color: #121212;
        }

        .action-touch-btn.disabled {
            background-color: #333;
            color: #666;
            cursor: not-allowed;
            box-shadow: none;
            pointer-events: none;
        }

        .inapp-overlay-window {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 99999;
        }

        .overlay-control-header {
            background: #111111;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            border-bottom: 1px solid #333;
        }

        .overlay-title {
            font-weight: bold;
            color: #fff;
            font-size: 1rem;
        }

        .done-close-btn {
            background: var(--brand-green);
            color: #121212;
            border: none;
            padding: 9px 20px;
            font-weight: bold;
            font-size: 0.95rem;
            border-radius: 6px;
            cursor: pointer;
        }

        .overlay-viewport-iframe,
        object {
            width: 100%;
            height: calc(100% - 55px);
            border: none;
            background: white;
        }

        /* Venue banner at top (optional) */
        .venue-banner {
            max-width: 100%;
            display: block;
            margin: 0 auto;
        }

        /* Instructor photo (optional) */
        .venue-instructor-photo {
            max-width: 100%;
            border-radius: 12px;
            margin: 10px auto 0 auto;
            display: block;
        }

        /* Watermark logo (optional) */
        .venue-watermark {
            position: fixed;
            bottom: 10px;
            right: 10px;
            opacity: 0.15;
            width: 120px;
            pointer-events: none;
        }

        /* Footer badge (optional) */
        .venue-footer {
            text-align: center;
            color: #b3b3b3;
            font-size: 0.85rem;
            padding: 10px 0 20px 0;
        }

        /* Splash screen (optional) */
        .venue-splash-screen {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100000;
        }

        .venue-splash-screen img {
            max-width: 80%;
            margin-bottom: 20px;
        }

        .venue-splash-screen span {
            color: #fff;
            font-size: 1.1rem;
            font-weight: bold;
        }

        @media (max-width: 380px) {
            .header-bar {
                height: 48px !important;
                padding: 10px !important;
                font-size: 1.1rem !important;
            }
        }
    </style>
</head>
<body>
    <!--
    ============================================
    OPTIONAL SPLASH SCREEN
    - Will be shown briefly if venueConfig.assets.splashImageUrl is set.
    - PNG or SVG, recommended width: 600–1200px.
    ============================================
    -->
    <div id="venueSplash" class="venue-splash-screen" style="display:none;">
        <img id="venueSplashImage" src="" alt="Venue Splash">
        <span id="venueSplashText">Loading LineDance Player...</span>
    </div>

    <div class="header-bar">
        <button class="back-nav-btn"
                id="navbarReturnTrigger"
                onclick="navigateToPlaylistHubMenu()">⬅ Playlists</button>
        <span id="applicationHeaderTitle">LineDance Player</span>
    </div>

    <!--
    ============================================
    VENUE BANNER (OPTIONAL)
    - PNG or SVG.
    - Recommended width: 600–1200px.
    - If no bannerUrl is provided, this will be hidden.
    ============================================
    -->
    <div class="app-container" style="padding-bottom: 0;">
        <img id="venueBanner" class="venue-banner" src="" alt="Venue Banner" style="display:none;">
    </div>

    <!--
    ============================================
    SEARCH + SYNC BAR
    - Placeholder text will be set from venueConfig.searchPlaceholder.
    ============================================
    -->
    <div class="app-container" style="padding-bottom: 0; display: flex; gap: 10px; align-items: center;">
        <input type="text"
               id="danceSearchInput"
               placeholder=""
               oninput="handleLiveSearchInput()"
               style="flex: 1; padding: 14px; border-radius: 8px; border: 1px solid #444; background: #1a1a1a; color: white; font-size: 1rem; box-sizing: border-box; height: 50px;">
        <button onclick="forceCacheBusterReload()"
                style="background: var(--brand-green); color: #121212; border: none; padding: 0 16px; border-radius: 8px; font-size: 0.95rem; font-weight: bold; cursor: pointer; height: 50px; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 6px rgba(0,0,0,0.2); white-space: nowrap;">
            Sync Playlist
        </button>
    </div>

    <!--
    ============================================
    INSTRUCTOR PHOTO (OPTIONAL)
    - JPG or PNG.
    - Recommended height: 400–800px.
    - If no instructorPhotoUrl is provided, this will be hidden.
    ============================================
    -->
    <div class="app-container" style="padding-top: 0;">
        <img id="venueInstructorPhoto" class="venue-instructor-photo" src="" alt="Instructor" style="display:none;">
    </div>

    <!--
    ============================================
    EMAIL / FEEDBACK BANNER
    - Text will be set from venueConfig.email and venueConfig.name.
    ============================================
    -->
    <div style="text-align: center; margin: 15px auto; padding: 0 20px; max-width: 650px; box-sizing: border-box;">
        <span id="venueEmailBanner"
              style="color: #b3b3b3; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 0.95rem; font-weight: bold; letter-spacing: 0.3px;">
        </span>
    </div>

    <!-- MAIN APP VIEWPORT -->
    <div class="app-container" id="masterApplicationViewport"></div>

    <!-- OVERLAY FOR STEPS / YOUTUBE -->
    <div id="playerOverlayFrame" class="inapp-overlay-window"></div>

    <!-- WATERMARK LOGO (OPTIONAL) -->
    <img id="venueWatermark" class="venue-watermark" src="" alt="Venue Watermark" style="display:none;">

    <!-- FOOTER BADGE (OPTIONAL) -->
    <div id="venueFooter" class="venue-footer"></div>

        /* ============================================
           APP STATE
           ============================================ */
        let selectedActivePlaylistGroup = null;
        let activeSearchQueryString = "";

        /* ============================================
           VENUE INITIALIZATION
           - Applies venueConfig to:
             - header title
             - search placeholder
             - email banner
             - theme colors
             - visual assets (banner, icon, background, etc.)
             - splash screen (optional)
           ============================================ */
        function initializeVenueBranding() {
            // Header title
            const headerTitleEl = document.getElementById('applicationHeaderTitle');
            if (headerTitleEl) {
                headerTitleEl.innerText = venueConfig.headerTitle || venueConfig.name || "LineDance Player";
            }

            // Search placeholder
            const searchInput = document.getElementById('danceSearchInput');
            if (searchInput) {
                searchInput.placeholder = venueConfig.searchPlaceholder || "Search dances...";
            }

            // Email banner text
            const emailBanner = document.getElementById('venueEmailBanner');
            if (emailBanner) {
                const venueName = venueConfig.name || "LineDance Player";
                const email = venueConfig.email || "";
                if (email) {
                    emailBanner.innerText = `✉ ${venueName} Feedback & Music Requests: ${email}`;
                } else {
                    emailBanner.innerText = "";
                }
            }

            // Theme colors
            if (venueConfig.theme) {
                const root = document.documentElement;
                root.style.setProperty('--brand-green', venueConfig.theme.brandGreen || '#2ecc71');
                root.style.setProperty('--dark-gray', venueConfig.theme.darkGray || '#1e1e1e');
                root.style.setProperty('--card-bg', venueConfig.theme.cardBg || '#2b2b2b');
                root.style.setProperty('--btn-blue', venueConfig.theme.buttonBlue || '#34495e');
            }

            // Background image
            if (venueConfig.assets.backgroundImageUrl) {
                document.documentElement.style.setProperty(
                    '--venue-bg-image',
                    `url(${venueConfig.assets.backgroundImageUrl})`
                );
            } else {
                document.documentElement.style.setProperty('--venue-bg-image', 'none');
            }

            // Banner image
            const bannerEl = document.getElementById('venueBanner');
            if (bannerEl) {
                if (venueConfig.assets.bannerUrl) {
                    bannerEl.src = venueConfig.assets.bannerUrl;
                    bannerEl.style.display = 'block';
                } else {
                    bannerEl.style.display = 'none';
                }
            }

            // Instructor photo
            const instructorEl = document.getElementById('venueInstructorPhoto');
            if (instructorEl) {
                if (venueConfig.assets.instructorPhotoUrl) {
                    instructorEl.src = venueConfig.assets.instructorPhotoUrl;
                    instructorEl.style.display = 'block';
                } else {
                    instructorEl.style.display = 'none';
                }
            }

            // Watermark logo
            const watermarkEl = document.getElementById('venueWatermark');
            if (watermarkEl) {
                if (venueConfig.assets.watermarkUrl) {
                    watermarkEl.src = venueConfig.assets.watermarkUrl;
                    watermarkEl.style.display = 'block';
                } else {
                    watermarkEl.style.display = 'none';
                }
            }

            // Footer text
            const footerEl = document.getElementById('venueFooter');
            if (footerEl) {
                footerEl.innerText = venueConfig.footerText || "";
            }

            // Touch icon (home screen icon)
            const touchIconEl = document.getElementById('venueTouchIcon');
            if (touchIconEl) {
                if (venueConfig.assets.touchIconUrl) {
                    touchIconEl.href = venueConfig.assets.touchIconUrl;
                } else {
                    touchIconEl.href = "";
                }
            }

            // Splash screen
            const splashEl = document.getElementById('venueSplash');
            const splashImgEl = document.getElementById('venueSplashImage');
            const splashTextEl = document.getElementById('venueSplashText');
            if (splashEl && splashImgEl && splashTextEl) {
                if (venueConfig.assets.splashImageUrl) {
                    splashImgEl.src = venueConfig.assets.splashImageUrl;
                    splashTextEl.innerText = venueConfig.headerTitle || venueConfig.name || "LineDance Player";
                    splashEl.style.display = 'flex';

                    // Hide splash after 1.5 seconds
                    setTimeout(() => {
                        splashEl.style.display = 'none';
                    }, 1500);
                } else {
                    splashEl.style.display = 'none';
                }
            }
        }

        /* ============================================
           NAVIGATION + SEARCH
           ============================================ */
        function navigateToPlaylistHubMenu() {
            selectedActivePlaylistGroup = null;
            activeSearchQueryString = "";
            document.getElementById('danceSearchInput').value = "";
            document.getElementById('navbarReturnTrigger').style.display = 'none';
            document.getElementById('applicationHeaderTitle').innerText =
                venueConfig.headerTitle || venueConfig.name || 'LineDance Player';
            renderApplicationInterface();
        }

        function openSpecificPlaylistView(groupName) {
            selectedActivePlaylistGroup = groupName;
            activeSearchQueryString = "";
            document.getElementById('danceSearchInput').value = "";
            document.getElementById('navbarReturnTrigger').style.display = 'block';
            document.getElementById('applicationHeaderTitle').innerText = groupName;
            renderApplicationInterface();
        }

        function handleLiveSearchInput() {
            const searchBox = document.getElementById('danceSearchInput');
            activeSearchQueryString = searchBox.value.toLowerCase().trim();
            if (activeSearchQueryString !== "") {
                selectedActivePlaylistGroup = null;
                document.getElementById('navbarReturnTrigger').style.display = 'block';
                document.getElementById('applicationHeaderTitle').innerText = 'Search Results';
            } else if (activeSearchQueryString === "" && selectedActivePlaylistGroup === null) {
                document.getElementById('navbarReturnTrigger').style.display = 'none';
                document.getElementById('applicationHeaderTitle').innerText =
                    venueConfig.headerTitle || venueConfig.name || 'LineDance Player';
            }
            renderApplicationInterface();
        }

        /* ============================================
           MAIN RENDER FUNCTION
           ============================================ */
        function renderApplicationInterface() {
            const viewport = document.getElementById('masterApplicationViewport');
            if (!viewport) return;
            viewport.innerHTML = '';

            // SEARCH MODE
            if (activeSearchQueryString !== "") {
                const matchedTracks = localDanceDatabase.filter(track => {
                    const danceName = (track.name || "").toLowerCase();
                    const choreographer = (track.choreographer || "").toLowerCase();
                    return danceName.includes(activeSearchQueryString) ||
                           choreographer.includes(activeSearchQueryString);
                });
                if (matchedTracks.length === 0) {
                    viewport.innerHTML =
                        '<p style="text-align:center;color:#aaa;margin-top:20px;">No matching dances found on the roster.</p>';
                    return;
                }
                renderDanceCardsList(matchedTracks, viewport);
            }
            // PLAYLIST HUB
            else if (selectedActivePlaylistGroup === null) {
                let groupNames;
                if (venueConfig.playlistGroups && venueConfig.playlistGroups.length > 0) {
                    // Use venue-defined groups
                    groupNames = [...venueConfig.playlistGroups];
                } else {
                    // Derive groups from track.group
                    groupNames = [...new Set(localDanceDatabase.map(track => track.playlist || "General"))].sort();
                }

                const grid = document.createElement('div');
                grid.className = 'playlist-selection-grid';
                groupNames.forEach(name => {
                    const count = localDanceDatabase.filter(t => t.playlist === name).length;
                    const card = document.createElement('div');
                    card.className = 'playlist-hub-card';
                    card.innerHTML = `<div>${name}</div><div class="playlist-track-counter">${count} Dances</div>`;
                    card.onclick = () => openSpecificPlaylistView(name);
                    grid.appendChild(card);
                });
                viewport.appendChild(grid);
            }
            // SPECIFIC PLAYLIST VIEW
            else {
                const filteredTracks = localDanceDatabase.filter(
                    track => track.playlist === selectedActivePlaylistGroup
                );
                renderDanceCardsList(filteredTracks, viewport);
            }
        }

        /* ============================================
           DANCE CARD RENDERING
           ============================================ */
        function renderDanceCardsList(tracksList, containerElement) {
            tracksList.forEach(track => {
                const card = document.createElement('div');
                card.className = 'dance-entry-card';

                const btnSteps = track.steps
                    ? `<button class="action-touch-btn" onclick="launchMediaOverlay('${track.steps}', '${track.name} - Steps')">Steps</button>`
                    : `<button class="action-touch-btn disabled">None</button>`;

                const btnTeach = track.teach
                    ? `<button class="action-touch-btn" onclick="launchMediaOverlay('${track.teach}', '${track.name} - Teach')">Teach</button>`
                    : `<button class="action-touch-btn disabled">None</button>`;

                const btnDemo = track.demo
                    ? `<button class="action-touch-btn" onclick="launchMediaOverlay('${track.demo}', '${track.name} - Demo')">Demo</button>`
                    : `<button class="action-touch-btn disabled">None</button>`;

                const btnMusic = track.music
                    ? `<button class="action-touch-btn" onclick="launchMediaOverlay('${track.music}', '${track.name} - Play')">Music</button>`
                    : `<button class="action-touch-btn disabled">None</button>`;

                card.innerHTML = `
                    <div class="title-line">${track.name} • By: ${track.choreographer}</div>
                    <div class="meta-line">Song: ${track.song} - ${track.artist} (${track.playlist})</div>
                    <div class="button-bar-grid">
                        ${btnSteps}
                        ${btnTeach}
                        ${btnDemo}
                        ${btnMusic}
                    </div>
                `;
                containerElement.appendChild(card);
            });
        }

        /* ============================================
           OVERLAY LOGIC (STEPS + YOUTUBE)
           - Steps: CopperKnob / step sheet via <object>
           - Teach/Demo/Music: YouTube via <iframe>
           - HTTPS enforcement for YouTube
           - Sandbox permissions preserved
           ============================================ */
        function launchMediaOverlay(targetUrl, displayTitle) {
            if (!targetUrl) return;

            // Force HTTPS for YouTube and other embeds
            targetUrl = targetUrl.replace('http://', 'https://');

            const container = document.getElementById('playerOverlayFrame');
            if (!container) return;

            container.style.display = 'none';
            container.innerHTML = '';

            if (displayTitle.includes("Steps")) {
                // STEPS: use <object> for CopperKnob / step sheets
                container.innerHTML = `
                    <div class="overlay-control-header">
                        <span class="overlay-title" id="overlayPanelTitle">${displayTitle}</span>
                        <button class="done-close-btn" onclick="shutOverlayViewer()">Done</button>
                    </div>
                    <object data="${targetUrl}" class="overlay-viewport-iframe" type="text/html"></object>
                `;
            } else {
                // YOUTUBE: use <iframe> with proper sandbox + allow
                container.innerHTML = `
                    <div class="overlay-control-header">
                        <span class="overlay-title" id="overlayPanelTitle">${displayTitle}</span>
                        <button class="done-close-btn" onclick="shutOverlayViewer()">Done</button>
                    </div>
                    <iframe id="appIframeViewport"
                            class="overlay-viewport-iframe"
                            src="${targetUrl}"
                            allow="autoplay; encrypted-media; fullscreen"
                            sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-popups-to-escape-sandbox">
                    </iframe>
                `;
            }
            container.style.display = 'block';
        }

        function shutOverlayViewer() {
            const container = document.getElementById('playerOverlayFrame');
            if (container) {
                container.style.display = 'none';
                container.innerHTML = '';
            }
        }

        /* ============================================
           CACHE BUSTER RELOAD
           - Forces a fresh load of the file.
           ============================================ */
        function forceCacheBusterReload() {
            const uniqueTimestamp = new Date().getTime();
            window.location.href =
                window.location.origin + window.location.pathname + '?v=' + uniqueTimestamp;
        }

        /* ============================================
           APP BOOTSTRAP
           ============================================ */
        window.onload = function () {
            initializeVenueBranding();
            renderApplicationInterface();
        };
    </script>
